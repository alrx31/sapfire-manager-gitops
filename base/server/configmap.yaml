apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  APP_DB_HOST: sapfire-db
  APP_DB_PORT: "5432"
  APP_DB_NAME: sapfire
  APP_DB_USER: sapfire
  # Public issuer — must equal the "iss" claim in browser-issued tokens, see
  # ../../../DEPLOY.md ("Keycloak hostname / issuer"). Placeholder host,
  # patched per overlay.
  Keycloak__Authority: https://auth.sapfire.test/realms/sapfire
  # In-cluster Service DNS name, not routable from outside — used for discovery
  # and the Admin REST API, since the public hostname is not resolvable inside
  # the cluster network.
  Keycloak__InternalUrl: http://keycloak:8080
  Keycloak__Audience: sapfire-api
  Keycloak__Admin__ClientId: sapfire-api
  # Rate limiting (AD-19): per user (token "sub") / per client IP for anonymous calls.
  RateLimiting__Enabled: "true"
  RateLimiting__User__PermitLimit: "300"
  RateLimiting__User__Window: "00:01:00"
  RateLimiting__Anonymous__PermitLimit: "60"
  RateLimiting__Anonymous__Window: "00:01:00"
  # X-Forwarded-For is trusted only from pods (k3s default cluster CIDR) and only two hops
  # deep: ingress-nginx -> client nginx -> server. See ../../../DEPLOY.md "Rate limiting".
  ForwardedHeaders__KnownNetworks__0: 10.42.0.0/16
  ForwardedHeaders__ForwardLimit: "2"
