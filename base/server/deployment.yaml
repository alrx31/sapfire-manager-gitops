apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
      # Read by the Prometheus pod discovery in base/monitoring (AD-21).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: server
          image: sapfire/server:latest
          ports:
            - containerPort: 8080
            # /metrics only; not in the Service, so the ingress cannot reach it.
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: server-config
          env:
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: sapfire-db-credentials, key: APP_DB_PASSWORD }
            # Composed from the server-config vars via k8s' $(VAR) dependent-env-var
            # expansion (same shape docker-compose.yml interpolates), so only
            # the password itself needs to be a Secret key.
            - name: ConnectionStrings__Default
              value: "Host=$(APP_DB_HOST);Port=$(APP_DB_PORT);Database=$(APP_DB_NAME);Username=$(APP_DB_USER);Password=$(APP_DB_PASSWORD)"
            - name: Keycloak__Admin__ClientSecret
              valueFrom:
                secretKeyRef: { name: keycloak-client-secret, key: KEYCLOAK_ADMIN_CLIENT_SECRET }
            # Object storage for finished exports (AD-05); the keys come from minio-credentials.
            - name: ExportStorage__AccessKey
              valueFrom:
                secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_USER }
            - name: ExportStorage__SecretKey
              valueFrom:
                secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_PASSWORD }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
