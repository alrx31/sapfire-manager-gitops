# Metrics stack (AD-21, 13.3.3): Prometheus scrapes the API and the Worker, Grafana shows the
# "Sapfire overview" dashboard. Both are ClusterIP only; open Grafana with port-forward.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheus-rbac.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: grafana-provisioning
    files:
      - datasource.yaml=grafana/datasource.yaml
      - dashboards.yaml=grafana/dashboards.yaml
  - name: grafana-dashboards
    files:
      - sapfire-overview.json=grafana/sapfire-overview.json
