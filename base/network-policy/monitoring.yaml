# Prometheus discovers pods through the Kubernetes API. The API server address differs per
# cluster (k3s: node IP on 6443, managed clusters: 443), so the rule allows those two ports
# on private addresses only, never towards the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - { protocol: TCP, port: 9090 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: server
      ports:
        - { protocol: TCP, port: 9464 }
    - to:
        - podSelector:
            matchLabels:
              app: worker
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - { protocol: TCP, port: 6443 }
        - { protocol: TCP, port: 443 }
---
# Grafana is reached through `kubectl port-forward`, which does not pass NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - { protocol: TCP, port: 9090 }
