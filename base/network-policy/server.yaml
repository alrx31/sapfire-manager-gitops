apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server
spec:
  podSelector:
    matchLabels:
      app: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: client
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - { protocol: TCP, port: 9464 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: sapfire-db
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - { protocol: TCP, port: 9000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-migrate
spec:
  podSelector:
    matchLabels:
      app: server-migrate
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: sapfire-db
      ports:
        - { protocol: TCP, port: 5432 }
