apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sapfire-db
spec:
  podSelector:
    matchLabels:
      app: sapfire-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: server
        - podSelector:
            matchLabels:
              app: worker
        - podSelector:
            matchLabels:
              app: server-migrate
        - podSelector:
            matchLabels:
              app: db-backup
              backup-target: app
      ports:
        - { protocol: TCP, port: 5432 }
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-db
spec:
  podSelector:
    matchLabels:
      app: keycloak-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: keycloak
        - podSelector:
            matchLabels:
              app: db-backup
              backup-target: keycloak
      ports:
        - { protocol: TCP, port: 5432 }
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-backup
spec:
  podSelector:
    matchLabels:
      app: db-backup
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: sapfire-db
        - podSelector:
            matchLabels:
              app: keycloak-db
      ports:
        - { protocol: TCP, port: 5432 }
