apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  # Exactly one: the scheduler has no cross-instance lock (AD-02), and Recreate keeps a
  # rollout from running the old and the new Pod side by side.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: worker
          image: sapfire/worker:latest
          ports:
            - name: internal
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: worker-config
          env:
            # Database settings are shared with the API through server-config.
            - name: APP_DB_HOST
              valueFrom:
                configMapKeyRef: { name: server-config, key: APP_DB_HOST }
            - name: APP_DB_PORT
              valueFrom:
                configMapKeyRef: { name: server-config, key: APP_DB_PORT }
            - name: APP_DB_NAME
              valueFrom:
                configMapKeyRef: { name: server-config, key: APP_DB_NAME }
            - name: APP_DB_USER
              valueFrom:
                configMapKeyRef: { name: server-config, key: APP_DB_USER }
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: sapfire-db-credentials, key: APP_DB_PASSWORD }
            - name: ConnectionStrings__Default
              value: "Host=$(APP_DB_HOST);Port=$(APP_DB_PORT);Database=$(APP_DB_NAME);Username=$(APP_DB_USER);Password=$(APP_DB_PASSWORD)"
            # Keycloak Admin API access (the password-expiry and temp-password-expiry jobs) is shared with the API:
            # the same server-config keys and the same keycloak-client-secret.
            - name: Keycloak__Authority
              valueFrom:
                configMapKeyRef: { name: server-config, key: Keycloak__Authority }
            - name: Keycloak__InternalUrl
              valueFrom:
                configMapKeyRef: { name: server-config, key: Keycloak__InternalUrl }
            - name: Keycloak__Admin__ClientId
              valueFrom:
                configMapKeyRef: { name: server-config, key: Keycloak__Admin__ClientId }
            - name: Keycloak__Admin__ClientSecret
              valueFrom:
                secretKeyRef: { name: keycloak-client-secret, key: KEYCLOAK_ADMIN_CLIENT_SECRET }
            # Broker address and user are shared with the rabbitmq StatefulSet.
            - name: RabbitMq__Host
              valueFrom:
                configMapKeyRef: { name: rabbitmq-config, key: RABBITMQ_HOST }
            - name: RabbitMq__Port
              valueFrom:
                configMapKeyRef: { name: rabbitmq-config, key: RABBITMQ_PORT }
            - name: RabbitMq__Username
              valueFrom:
                configMapKeyRef: { name: rabbitmq-config, key: RABBITMQ_USER }
            # Optional so that the scheduler keeps running before the secret is sealed: without
            # it the relay fails to connect and events wait in the outbox (7.2.7).
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef: { name: rabbitmq-credentials, key: RABBITMQ_PASSWORD, optional: true }
            # Optional: a relay inside the cluster usually accepts mail without authentication.
            - name: Email__Smtp__Password
              valueFrom:
                secretKeyRef: { name: smtp-credentials, key: SMTP_PASSWORD, optional: true }
            # Object storage for finished exports (AD-05); the keys come from minio-credentials.
            - name: ExportStorage__AccessKey
              valueFrom:
                secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_USER }
            - name: ExportStorage__SecretKey
              valueFrom:
                secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_PASSWORD }
          readinessProbe:
            httpGet: { path: /health/ready, port: internal }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: internal }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
