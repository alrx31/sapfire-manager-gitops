apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  labels:
    app: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: sapfire/client:latest
          ports:
            - containerPort: 80
          env:
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef: { name: client-config, key: KEYCLOAK_URL }
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef: { name: client-config, key: KEYCLOAK_REALM }
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef: { name: client-config, key: KEYCLOAK_CLIENT_ID }
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef: { name: client-config, key: API_BASE_URL }
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
