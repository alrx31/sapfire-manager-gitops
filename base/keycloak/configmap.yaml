apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
data:
  KC_DB: postgres
  KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
  KC_DB_USERNAME: keycloak
  # Full URL, not a bare hostname — see deploy/DEPLOY.md "Keycloak hostname /
  # issuer" for why. Placeholder host, patched per overlay.
  KC_HOSTNAME: https://auth.sapfire.test
  # Ingress terminates TLS and talks plain HTTP to the Service, same relationship
  # the compose keycloak-tls front end had — keep this true so the server's
  # in-cluster discovery (Keycloak__InternalUrl) still resolves a reachable jwks_uri.
  KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
  KC_HTTP_ENABLED: "true"
  KC_PROXY_HEADERS: xforwarded
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT: "14400"
  KEYCLOAK_SSO_SESSION_MAX_LIFESPAN: "86400"
  SPA_PUBLIC_URL: https://app.sapfire.test/
  # TOTP switch (src/keycloak/KEYCLOAK.md, "TOTP switch"). REQUIRED + "true" is the policy of the
  # requirements; DISABLED + "false" turns off the code prompt and the OTP setup step.
  KEYCLOAK_OTP_REQUIREMENT: REQUIRED
  KEYCLOAK_OTP_SETUP_ENABLED: "true"
