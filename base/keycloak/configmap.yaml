apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
data:
  KC_DB: postgres
  KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
  KC_DB_USERNAME: keycloak
  # Full URL, not a bare hostname — see deploy/DEPLOY.md "Keycloak hostname /
  # issuer" for why. Placeholder host, patched per overlay.
  KC_HOSTNAME: https://auth.sapfire.test
  # Ingress terminates TLS and talks plain HTTP to the Service, same relationship
  # the compose keycloak-tls front end had — keep this true so the server's
  # in-cluster discovery (Keycloak__InternalUrl) still resolves a reachable jwks_uri.
  KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
  KC_HTTP_ENABLED: "true"
  KC_PROXY_HEADERS: xforwarded
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
