apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - realm-sync-job.yaml

# argocd-client.json is not vendored: it lives only here (no compose or E2E import reads it,
# the native --import-realm cannot resolve flow aliases in client flow overrides).
# The other realm JSON files here are vendored copies of ../../../../src/keycloak/, the single
# source of truth (see src/keycloak/KEYCLOAK.md). `kubectl kustomize`/
# `kubectl apply -k` refuse to read generator files from outside their own root
# (RestrictionRootOnly, no flag to relax it), so a copy is unavoidable — run
# ../../sync-realm-export.sh after editing the source, and check-docs flags drift.
configMapGenerator:
  - name: keycloak-realm-export
    files:
      - master-realm.json
      - realm-export.json
      - argocd-client.json
