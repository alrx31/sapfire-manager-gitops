# Declarative, idempotent realm sync — the preferred option in
# ../../../../tasks/us/k8s-migration.md over `--import-realm` (which only ever
# imports once per DB) and over kcadm.sh scripting. Under plain `kubectl apply -k`
# the annotations are inert — delete the previous Job before re-applying
# (`kubectl delete job keycloak-realm-sync`).
#
# PostSync, not PreSync as ../../../../tasks/us/argocd-gitops.md tentatively suggested:
# keycloak-config-cli drives Keycloak's Admin REST API, so it needs a *running* Keycloak.
# In the PreSync phase of a first sync the Deployment does not exist yet, so the job would
# burn its availability check and fail the sync every time. PostSync also matches what the
# job actually guards — realm config is not a schema migration the app cannot boot without.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-sync
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: keycloak-realm-sync
    spec:
      restartPolicy: Never
      containers:
        - name: keycloak-config-cli
          image: adorsys/keycloak-config-cli:6.5.1-26.0.5
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: 120s
            - name: KEYCLOAK_USER
              valueFrom: { configMapKeyRef: { name: keycloak-config, key: KC_BOOTSTRAP_ADMIN_USERNAME } }
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-admin-credentials, key: KEYCLOAK_ADMIN_PASSWORD }
            - name: IMPORT_FILES_LOCATIONS
              value: /config/master-realm.json,/config/realm-export.json,/config/argocd-client.json
            # Groups, clients and authentication flows absent from the files stay: org groups
            # made by create-org.sh, SSO clients registered in the console together with the
            # browser flow they bind (see KEYCLOAK.md, "SSO clients of other services"), and
            # in dev the base and demo files that each describe only part of the realm. Users
            # have no managed switch in keycloak-config-cli and are never deleted; a password
            # tagged userLabel "initial" is set only when the user is created.
            - name: IMPORT_MANAGED_GROUP
              value: no-delete
            - name: IMPORT_MANAGED_CLIENT
              value: no-delete
            - name: IMPORT_MANAGED_AUTHENTICATIONFLOW
              value: no-delete
            # realm-export.json is committed to git, so the sapfire-api client secret cannot be
            # a literal there. keycloak-config-cli substitutes $(env:...) before the JSON is
            # parsed, letting the sealed value reach Keycloak without ever landing in the repo.
            - name: IMPORT_VAR_SUBSTITUTION_ENABLED
              value: "true"
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: keycloak-client-secret, key: KEYCLOAK_ADMIN_CLIENT_SECRET }
            # Secret of the Argo CD client. Absent secret: the client gets a placeholder that no
            # Argo CD knows, so sign-in to Argo CD fails until argocd-oidc-client is sealed
            # (deploy/argocd/README.md, "Sign-in").
            - name: ARGOCD_OIDC_SECRET
              valueFrom:
                secretKeyRef: { name: argocd-oidc-client, key: ARGOCD_OIDC_SECRET, optional: true }
            - name: KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT
              valueFrom: { configMapKeyRef: { name: keycloak-config, key: KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT } }
            - name: KEYCLOAK_SSO_SESSION_MAX_LIFESPAN
              valueFrom: { configMapKeyRef: { name: keycloak-config, key: KEYCLOAK_SSO_SESSION_MAX_LIFESPAN } }
            - name: SPA_PUBLIC_URL
              valueFrom: { configMapKeyRef: { name: keycloak-config, key: SPA_PUBLIC_URL } }
            - name: KEYCLOAK_OTP_REQUIREMENT
              valueFrom: { configMapKeyRef: { name: keycloak-config, key: KEYCLOAK_OTP_REQUIREMENT, optional: true } }
            - name: KEYCLOAK_OTP_SETUP_ENABLED
              valueFrom: { configMapKeyRef: { name: keycloak-config, key: KEYCLOAK_OTP_SETUP_ENABLED, optional: true } }
            # Google sign-in (KEYCLOAK.md, "Sign-in with Google"). The secret is optional: without
            # it the provider stays disabled and the login page shows no Google button.
            - name: GOOGLE_IDP_ENABLED
              valueFrom:
                secretKeyRef: { name: google-idp, key: GOOGLE_IDP_ENABLED, optional: true }
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: google-idp, key: GOOGLE_CLIENT_ID, optional: true }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: google-idp, key: GOOGLE_CLIENT_SECRET, optional: true }
          volumeMounts:
            - name: realm-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-export
