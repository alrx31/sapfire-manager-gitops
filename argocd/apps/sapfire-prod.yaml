# Prod: automated, but only inside the nightly sync window of project `sapfire`
# (project.yaml). Promotion is a commit pinning the image tag in overlays/prod; Argo CD shows
# OutOfSync until the window opens and then rolls it out with downtime (TZ 13.3.2).
# `prune: false`: a resource removed from git is not deleted from prod unattended at night,
# the backup PVC included. Prune by hand with `argocd app sync sapfire-prod --prune`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sapfire-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sapfire
  source:
    repoURL: https://github.com/alrx31/sapfire-manager-gitops.git
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: sapfire-prod
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
