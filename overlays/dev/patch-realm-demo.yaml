# Dev applies the demo orgs, users and the sapfire-seed client on top of the base realm.
# Order matters: the demo groups use realm roles and the demo users use groups, so the base
# file goes first. keycloak-config-cli keeps the order of the listed locations.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-sync
spec:
  template:
    spec:
      containers:
        - name: keycloak-config-cli
          env:
            - name: IMPORT_FILES_LOCATIONS
              value: /config/realm-export.json,/config/realm-demo.json
