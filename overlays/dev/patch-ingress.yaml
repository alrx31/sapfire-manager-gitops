apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sapfire
spec:
  rules:
    - host: app.dev.sapfire.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 80
    - host: auth.dev.sapfire.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
  tls:
    - hosts: ["app.dev.sapfire.127.0.0.1.nip.io"]
      secretName: sapfire-app-tls
    - hosts: ["auth.dev.sapfire.127.0.0.1.nip.io"]
      secretName: sapfire-auth-tls
