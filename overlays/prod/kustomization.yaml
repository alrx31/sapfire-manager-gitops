apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sapfire-prod
resources:
  - ../../base
  - namespace.yaml
  # - sealed-secrets   # uncomment once populated, see sealed-secrets/README.md
patches:
  - path: patch-issuer.yaml
  - path: patch-scale.yaml
  - path: patch-storage.yaml
# Prod pins an immutable tag, never `latest`. Jenkins writes only overlays/dev; promotion to
# prod is a human commit of a tag that already ran in dev (../../../argocd/README.md
# "Promotion"). "0000000" is a placeholder: no such image exists, so prod does not start
# until the first promotion commit.
images:
  - name: sapfire/client
    newName: ghcr.io/sapfire-manager/sapfire-client
    newTag: "0000000"
  - name: sapfire/server
    newName: ghcr.io/sapfire-manager/sapfire-server
    newTag: "0000000"
  - name: sapfire/worker
    newName: ghcr.io/sapfire-manager/sapfire-worker
    newTag: "0000000"
  - name: sapfire/keycloak
    newName: ghcr.io/sapfire-manager/sapfire-keycloak
    newTag: "0000000"
